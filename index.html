<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Drip</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#04040F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Drip">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="apple-touch-startup-image" href="icon-512.png">
<link rel="icon" href="icon-192.png">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  --bg:#04040F;
  --card:#080820;
  --card2:#0C0C28;
  --pill:#101030;
  --b:rgba(255,255,255,0.08);
  --bm:rgba(255,255,255,0.15);
  --t:#FFFFFF;
  --t2:#6B6B9A;
  --t3:#2D2D50;
  --red:#2D7EFF;
  --green:#34C759;
  --amber:#FF9500;
  --blue:#4DA6FF;
  --r:20px;--rsm:12px;--rxs:8px;
  --nav-h:65px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bot:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{background:var(--bg);-webkit-tap-highlight-color:transparent;}
body{
  font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--bg);color:var(--t);
  min-height:100vh;max-width:480px;margin:0 auto;
  padding-bottom:calc(var(--nav-h) + max(var(--safe-bot), 20px) + 20px);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  overflow-x:hidden;
}

/* ━━ NAV ━━ */
.nav{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:480px;
  background:rgba(8,8,18,0.92);
  backdrop-filter:saturate(180%) blur(30px);
  -webkit-backdrop-filter:saturate(180%) blur(30px);
  border-top:0.5px solid var(--b);
  display:flex;z-index:300;
  padding-bottom:max(var(--safe-bot), 20px);
  height:calc(var(--nav-h) + max(var(--safe-bot), 20px));
}
.nav-item{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:4px;padding:8px 0 0;cursor:pointer;
  user-select:none;-webkit-user-select:none;
  position:relative;transition:opacity .1s;
}
.nav-item:active{opacity:.6;}
.nav-svg{
  width:24px;height:24px;
  transition:transform .25s cubic-bezier(.34,1.56,.64,1);
  color:var(--t3);
}
.nav-item.on .nav-svg{
  color:var(--blue);
  transform:scale(1.12) translateY(-1px);
  filter:drop-shadow(0 2px 6px rgba(10,132,255,.5));
}
.nav-lbl{
  font-size:10px;font-weight:600;
  color:var(--t3);letter-spacing:.02em;
  transition:color .2s;
}
.nav-item.on .nav-lbl{color:var(--blue);}

/* ━━ HEADER ━━ */
.hdr{
  padding:calc(var(--safe-top) + 16px) 20px 0;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:200;
  background:linear-gradient(180deg,var(--bg) 80%,transparent);
}
.logo{
  font-size:20px;font-weight:900;
  letter-spacing:.06em;color:var(--t);
}
.logo b{
  color:var(--red);
  text-shadow:0 0 20px rgba(45,126,255,.5);
}
.hdr-right{display:flex;gap:7px;}
.hdr-btn,.icon-btn{
  background:var(--pill);
  border:0.5px solid var(--b);
  border-radius:30px;
  color:var(--t2);font-family:inherit;
  font-size:11px;font-weight:600;
  padding:7px 14px;cursor:pointer;
  transition:all .15s;
}
.hdr-btn:active,.icon-btn:active{background:var(--card2);color:var(--t);}

/* ━━ PANELS ━━ */
.panel{display:none;padding:14px 20px 0;}
.panel.on{display:block;}

/* ━━ HERO ━━ */
.hero{
  background:var(--card);
  border:0.5px solid var(--b);
  border-radius:var(--r);
  padding:24px 22px 20px;
  margin-bottom:14px;
  position:relative;overflow:hidden;
}
.hero::after{
  content:'';
  position:absolute;inset:0;
  background:linear-gradient(135deg,
    rgba(45,126,255,.04) 0%,
    transparent 50%,
    rgba(77,166,255,.03) 100%);
  pointer-events:none;
}
.hero-eyebrow,.hero-lbl{
  font-size:12px;font-weight:500;
  color:var(--t2);letter-spacing:.05em;
  margin-bottom:6px;text-transform:uppercase;
}
.hero-amount,.hero-n{
  font-size:56px;font-weight:800;
  letter-spacing:-.04em;line-height:1;
  margin-bottom:22px;
  font-variant-numeric:tabular-nums;
  background:linear-gradient(135deg,#fff 60%,rgba(255,255,255,.7));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
}
.hero-amount .won,.hero-n .u{
  font-size:28px;font-weight:500;
  color:rgba(255,255,255,.4);
  -webkit-text-fill-color:rgba(255,255,255,.4);
  margin-right:3px;vertical-align:middle;
}
.stats,.sg{
  display:grid;grid-template-columns:1fr 1fr;
  gap:8px;margin-bottom:16px;
}
.stat,.sp{
  background:rgba(255,255,255,.04);
  border:0.5px solid rgba(255,255,255,.06);
  border-radius:var(--rsm);padding:12px 14px;
}
.stat-l,.sp-l{
  font-size:10px;font-weight:500;
  color:var(--t2);margin-bottom:5px;
  letter-spacing:.04em;text-transform:uppercase;
}
.stat-v,.sp-v{
  font-size:18px;font-weight:700;
  font-variant-numeric:tabular-nums;
}
.waste-rail,.wt{
  background:rgba(255,255,255,.06);
  border-radius:3px;height:3px;overflow:hidden;
}
.waste-fill,.wf{
  height:100%;border-radius:3px;
  background:linear-gradient(90deg,var(--red),rgba(45,126,255,.5));
  transition:width .9s cubic-bezier(.4,0,.2,1);
  box-shadow:0 0 8px rgba(45,126,255,.4);
}

/* ━━ ACTION ROW ━━ */
.action-row{display:flex;gap:8px;margin-bottom:14px;}
.action-btn{
  flex:1;padding:14px 0;border-radius:var(--rsm);
  border:none;font-family:inherit;font-size:13px;
  font-weight:700;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:6px;
  letter-spacing:.01em;
}
.action-btn:active{transform:scale(.96);}
.action-btn.primary,.sms-btn{
  background:linear-gradient(135deg,rgba(10,132,255,.15),rgba(10,132,255,.08));
  color:var(--blue);
  border:0.5px solid rgba(10,132,255,.3);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
}
.action-btn.secondary{
  background:var(--pill);color:var(--t2);
  border:0.5px solid var(--b);
}
.sms-btn{
  width:100%;padding:14px;margin-bottom:12px;
  border-radius:var(--rsm);font-family:inherit;
  font-size:13px;font-weight:700;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:7px;
}

/* ━━ BANNER ━━ */
.banner,.udbanner{
  background:rgba(10,132,255,.08);
  border:0.5px solid rgba(10,132,255,.22);
  border-radius:var(--rsm);padding:12px 14px;
  margin-bottom:12px;display:flex;
  align-items:center;justify-content:space-between;
  gap:10px;cursor:pointer;
}
.banner:active,.udbanner:active{background:rgba(10,132,255,.14);}
.banner-text,.udb-text{
  font-size:13px;color:var(--blue);
  font-weight:500;line-height:1.5;
}
.banner-cta,.udb-btn{
  background:var(--blue);color:#fff;
  border:none;border-radius:30px;
  font-family:inherit;font-size:11px;
  font-weight:700;padding:7px 14px;
  cursor:pointer;white-space:nowrap;flex-shrink:0;
  box-shadow:0 2px 8px rgba(45,126,255,.4);
}

/* ━━ SECTION ━━ */
.section-hdr{
  display:flex;align-items:center;
  justify-content:space-between;
  margin:20px 0 10px;
}
.section-title,.sl{
  font-size:11px;font-weight:700;
  color:var(--t2);letter-spacing:.08em;
  text-transform:uppercase;
}

/* ━━ CHIPS ━━ */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
.chip{
  display:flex;align-items:center;gap:5px;
  background:var(--card);
  border:0.5px solid var(--b);
  border-radius:30px;
  padding:6px 12px 6px 6px;
  font-size:12px;font-weight:500;color:var(--t2);
  cursor:pointer;user-select:none;
  transition:all .15s;
}
.chip:active{transform:scale(.94);}
.chip.on{
  border-color:var(--green);color:var(--green);
  background:rgba(52,199,89,.08);
}
.ci,.chip-ico{
  width:20px;height:20px;border-radius:6px;overflow:hidden;
  background:var(--pill);display:flex;align-items:center;
  justify-content:center;font-size:8px;font-weight:800;
  color:var(--t2);flex-shrink:0;
}
.ci img,.chip-ico img{width:100%;height:100%;object-fit:contain;}

/* ━━ ADD FORM ━━ */
.af,.add-form{
  background:var(--card);border:0.5px solid var(--b);
  border-radius:var(--r);padding:16px 18px;margin-bottom:16px;
}
.af-g1,.form-row{
  display:grid;grid-template-columns:1fr 90px;
  gap:8px;margin-bottom:8px;
}
.af-g2,.form-row2{
  display:grid;grid-template-columns:1fr 70px auto;gap:8px;
}
input,select{
  background:var(--pill);
  border:0.5px solid var(--b);
  border-radius:var(--rxs);
  color:var(--t);font-family:inherit;
  font-size:14px;padding:12px 14px;
  outline:none;width:100%;
  transition:border-color .2s;
  -webkit-appearance:none;appearance:none;
}
input::placeholder{color:var(--t3);}
input:focus,select:focus{border-color:rgba(10,132,255,.5);}
.add-btn,.form-submit{
  background:var(--blue);color:#fff;
  border:none;border-radius:var(--rxs);
  font-family:inherit;font-size:13px;font-weight:700;
  padding:12px 16px;cursor:pointer;white-space:nowrap;
  box-shadow:0 2px 8px rgba(45,126,255,.3);
}
.add-btn:active,.form-submit:active{opacity:.8;transform:scale(.97);}

/* ━━ SUB CARDS ━━ */
.sub-list{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;}
.sc{
  background:var(--card);
  border:0.5px solid var(--b);
  border-radius:var(--r);
  padding:14px 16px;
  display:flex;align-items:center;gap:13px;
  transition:all .15s;
  animation:slideUp .25s cubic-bezier(.34,1.2,.64,1);
}
.sc:active{background:var(--card2);transform:scale(.99);}
.sc.waste{
  border-color:rgba(255,45,85,.25);
  background:linear-gradient(135deg,rgba(255,45,85,.04),var(--card));
}
@keyframes slideUp{
  from{opacity:0;transform:translateY(12px) scale(.98);}
  to{opacity:1;transform:none;}
}
.sl-logo,.sc-logo{
  width:44px;height:44px;border-radius:12px;
  background:var(--pill);overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:800;color:var(--t2);
  flex-shrink:0;
}
.sl-logo img,.sc-logo img{
  width:100%;height:100%;object-fit:contain;padding:4px;
}
.sc-info{flex:1;min-width:0;}
.sn,.sc-name{
  font-size:15px;font-weight:600;color:var(--t);
  margin-bottom:4px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;
  letter-spacing:-.01em;
}
.smeta,.sc-meta{font-size:12px;color:var(--t2);}
.sr,.sc-right{
  display:flex;flex-direction:column;
  align-items:flex-end;gap:6px;flex-shrink:0;
}
.ubadge,.status-badge{
  font-size:11px;font-weight:700;
  padding:4px 10px;border-radius:30px;
  cursor:pointer;border:none;
  font-family:inherit;white-space:nowrap;
  letter-spacing:.01em;
}
.ubadge:active,.status-badge:active{opacity:.6;}
.dbtn,.del-btn{
  background:none;border:none;
  color:var(--t3);cursor:pointer;
  font-size:17px;line-height:1;padding:2px;
  transition:color .15s;
}
.dbtn:active,.del-btn:active{color:var(--red);}
.empty,.empty-state{
  text-align:center;padding:56px 0 24px;color:var(--t2);
}
.empty-icon{font-size:40px;margin-bottom:14px;}
.empty-title{font-size:17px;font-weight:700;color:var(--t);margin-bottom:8px;}
.empty-desc{font-size:13px;line-height:1.75;}

/* ━━ TIMELINE ━━ */
.tl-header,.tl-summary{
  background:var(--card);border:0.5px solid var(--b);
  border-radius:var(--r);padding:22px;margin-bottom:14px;
  position:relative;overflow:hidden;
}
.tl-header::after,.tl-summary::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(52,199,89,.04) 0%,transparent 60%);
  pointer-events:none;
}
.tl-total-lbl,.tl-eyebrow{
  font-size:11px;font-weight:600;color:var(--t2);
  letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;
}
.tl-total,.tl-amount{
  font-size:38px;font-weight:800;
  font-variant-numeric:tabular-nums;
  letter-spacing:-.03em;
  background:linear-gradient(135deg,#fff 60%,rgba(255,255,255,.6));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
}
.tl-sub,.tl-desc{font-size:12px;color:var(--t2);margin-top:5px;}
.tl-list,.tl-row-wrap{margin-bottom:14px;}
.tl-row,.tl-item{
  display:flex;align-items:center;gap:14px;
  padding:13px 0;border-bottom:0.5px solid var(--b);
}
.tl-row:last-child,.tl-item:last-child{border-bottom:none;}
.tl-date-col,.tl-date{width:44px;flex-shrink:0;text-align:center;}
.tl-day{
  font-size:22px;font-weight:800;
  font-variant-numeric:tabular-nums;line-height:1;color:var(--t);
}
.tl-dow{font-size:10px;color:var(--t2);margin-top:2px;font-weight:500;}
.tl-badge,.tl-pill{
  font-size:9px;font-weight:700;
  padding:2px 7px;border-radius:20px;
  margin-top:4px;display:inline-block;
}
.tl-logo{
  width:36px;height:36px;border-radius:9px;
  background:var(--pill);overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:800;color:var(--t2);flex-shrink:0;
}
.tl-logo img{width:100%;height:100%;object-fit:contain;padding:3px;}
.tl-name{
  font-size:14px;font-weight:500;color:var(--t);
  flex:1;min-width:0;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;
}
.tl-waste-tag,.tl-warn{font-size:11px;color:var(--red);font-weight:600;margin-top:2px;}
.tl-price{
  font-size:15px;font-weight:700;
  font-variant-numeric:tabular-nums;letter-spacing:-.01em;
}
.tl-no-billing{
  text-align:center;padding:40px 0;
  color:var(--t2);font-size:13px;line-height:1.8;
}
.edit-billing-btn{
  font-size:12px;color:var(--blue);
  background:none;border:none;
  font-family:inherit;cursor:pointer;
  text-decoration:underline;padding:0;margin-top:6px;
}

/* ━━ SAVINGS ━━ */
.save-hero,.savings-hero{
  background:linear-gradient(135deg,rgba(45,126,255,.1),rgba(45,126,255,.04));
  border:0.5px solid rgba(45,126,255,.2);
  border-radius:var(--r);padding:22px;margin-bottom:14px;
  position:relative;overflow:hidden;
}
.save-hero::before,.savings-hero::before{
  content:'';position:absolute;bottom:-30px;right:-20px;
  width:120px;height:120px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,45,85,.15) 0%,transparent 70%);
  pointer-events:none;
}
.save-lbl,.savings-eyebrow{
  font-size:11px;font-weight:600;
  color:rgba(77,166,255,.7);letter-spacing:.06em;
  text-transform:uppercase;margin-bottom:6px;
}
.save-n,.savings-amount{
  font-size:42px;font-weight:800;color:var(--red);
  letter-spacing:-.04em;font-variant-numeric:tabular-nums;
  margin-bottom:5px;
  text-shadow:0 0 30px rgba(255,45,85,.3);
}
.save-desc,.savings-desc{font-size:13px;color:var(--t2);}
.cancel-card{
  background:var(--card);
  border:0.5px solid rgba(255,45,85,.15);
  border-radius:var(--r);padding:16px;margin-bottom:10px;
}
.cc-header{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
.cc-logo{
  width:42px;height:42px;border-radius:11px;
  background:var(--pill);overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:800;color:var(--t2);flex-shrink:0;
}
.cc-logo img{width:100%;height:100%;object-fit:contain;padding:3px;}
.cc-name{font-size:15px;font-weight:700;color:var(--t);}
.cc-price,.cc-sub{font-size:12px;color:var(--t2);margin-top:2px;}
.cc-savings,.cc-nums{
  display:grid;grid-template-columns:1fr 1fr;
  gap:8px;margin-bottom:14px;
}
.cc-save-item,.cc-num{
  background:rgba(52,199,89,.08);
  border:0.5px solid rgba(52,199,89,.15);
  border-radius:var(--rxs);padding:10px 12px;
}
.cc-save-lbl,.cc-num-l{font-size:10px;color:var(--t2);margin-bottom:4px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;}
.cc-save-val,.cc-num-v{
  font-size:16px;font-weight:800;color:var(--green);
  font-variant-numeric:tabular-nums;
}
.cc-actions{display:flex;gap:7px;}
.cancel-btn,.cc-cancel{
  flex:1;padding:13px 0;
  background:rgba(255,45,85,.08);
  border:0.5px solid rgba(255,45,85,.25);
  border-radius:var(--rsm);
  font-family:inherit;font-size:13px;font-weight:700;color:var(--red);
  cursor:pointer;text-align:center;text-decoration:none;
  display:flex;align-items:center;justify-content:center;gap:5px;
}
.cancel-btn:active,.cc-cancel:active{background:rgba(255,45,85,.15);}
.cc-done{
  padding:13px 13px;
  background:rgba(52,199,89,.08);
  border:0.5px solid rgba(52,199,89,.22);
  border-radius:var(--rsm);
  font-family:inherit;font-size:12px;font-weight:700;
  color:var(--green);cursor:pointer;white-space:nowrap;
}
.keep-btn,.cc-keep{
  padding:13px 13px;background:var(--pill);
  border:0.5px solid var(--b);border-radius:var(--rsm);
  font-family:inherit;font-size:12px;color:var(--t2);cursor:pointer;
}
.save-empty{text-align:center;padding:52px 0;color:var(--t2);}
.share-all-btn,.share-btn{
  width:100%;padding:15px;
  background:var(--pill);border:0.5px solid var(--b);
  border-radius:var(--rsm);font-family:inherit;
  font-size:13px;font-weight:600;color:var(--t2);
  cursor:pointer;display:flex;align-items:center;
  justify-content:center;gap:8px;margin-top:6px;
}
.card-share-btn{
  width:100%;padding:15px;margin-bottom:10px;
  background:linear-gradient(135deg,rgba(45,126,255,.08),rgba(77,166,255,.06));
  border:0.5px solid rgba(45,126,255,.2);
  border-radius:var(--rsm);font-family:inherit;
  font-size:13px;font-weight:700;color:var(--t);
  cursor:pointer;display:flex;align-items:center;
  justify-content:center;gap:8px;
}

/* ━━ HISTORY ━━ */
.hist-total{
  background:rgba(52,199,89,.07);
  border:0.5px solid rgba(52,199,89,.14);
  border-radius:var(--rsm);padding:14px 16px;margin-bottom:10px;
}
.hist-total-lbl{
  font-size:10px;font-weight:700;
  color:rgba(52,199,89,.6);letter-spacing:.08em;
  text-transform:uppercase;margin-bottom:4px;
}
.hist-total-n{
  font-size:26px;font-weight:800;
  color:var(--green);font-variant-numeric:tabular-nums;
  letter-spacing:-.02em;
}
.hist-item{
  display:flex;align-items:center;gap:11px;
  padding:10px 0;border-bottom:0.5px solid var(--b);
}
.hist-item:last-child{border-bottom:none;}
.hist-logo{
  width:32px;height:32px;border-radius:8px;
  background:var(--pill);overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  font-size:9px;font-weight:800;color:var(--t2);flex-shrink:0;
}
.hist-logo img{width:100%;height:100%;object-fit:contain;padding:3px;}
.hist-name{font-size:13px;font-weight:500;color:var(--t2);flex:1;}

.notif-banner{

.notif-text{font-size:12px;color:var(--blue);line-height:1.5;}

  font-size:11px;font-weight:700;

  white-space:nowrap;flex-shrink:0;
  box-shadow:0 2px 8px rgba(45,126,255,.4);
}
.notif-granted{font-size:11px;color:var(--green);display:flex;align-items:center;gap:5px;}

/* ━━ MODALS ━━ */
.ov{
  position:fixed;inset:0;
  background:rgba(0,0,0,.75);
  display:flex;align-items:flex-end;justify-content:center;
  z-index:999;
  animation:fadeOv .22s ease;
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
}
@keyframes fadeOv{from{opacity:0;}to{opacity:1;}}
.sheet{
  background:linear-gradient(180deg,#0F0F22 0%,#0A0A18 100%);
  border:0.5px solid rgba(255,255,255,.1);
  border-radius:28px 28px 0 0;
  padding:0 22px calc(28px + var(--safe-bot));
  width:100%;max-width:480px;
  animation:slideSheet .3s cubic-bezier(.34,1.1,.64,1);
  max-height:88vh;overflow-y:auto;
}
@keyframes slideSheet{from{transform:translateY(100%);}to{transform:translateY(0);}}
.sheet-handle{
  width:40px;height:4px;
  background:rgba(255,255,255,.15);
  border-radius:2px;margin:14px auto 22px;
}
.sh-title,.sheet-title{
  font-size:20px;font-weight:800;
  letter-spacing:-.02em;margin-bottom:5px;color:var(--t);
}
.sh-sub,.sheet-sub{font-size:13px;color:var(--t2);margin-bottom:24px;line-height:1.65;}
.sh-confirm,.sheet-confirm{
  width:100%;padding:17px;
  background:var(--t);color:#080812;
  border:none;border-radius:var(--rsm);
  font-family:inherit;font-size:15px;font-weight:800;
  cursor:pointer;margin-top:16px;letter-spacing:-.01em;
}
.sh-confirm:disabled{opacity:.25;cursor:default;}
.sh-cancel,.sheet-cancel{
  width:100%;padding:14px;
  background:none;border:0.5px solid var(--b);
  border-radius:var(--rsm);font-family:inherit;
  font-size:13px;color:var(--t2);cursor:pointer;margin-top:8px;
}
.di-row{
  display:flex;align-items:center;gap:12px;
  padding:12px 0;border-bottom:0.5px solid var(--b);
}
.di-row:last-of-type{border-bottom:none;}
.di-logo{
  width:36px;height:36px;border-radius:10px;
  background:var(--pill);overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:800;color:var(--t2);flex-shrink:0;
}
.di-logo img{width:100%;height:100%;object-fit:contain;padding:3px;}
.di-name{
  font-size:14px;font-weight:500;color:var(--t);
  flex:1;min-width:0;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;
}
.di-btns{display:flex;gap:6px;flex-shrink:0;}
.di-btn{
  padding:7px 14px;border-radius:30px;
  font-family:inherit;font-size:12px;font-weight:600;
  cursor:pointer;border:0.5px solid var(--b);
  background:none;color:var(--t2);
}
.di-btn.y{background:rgba(52,199,89,.12);border-color:var(--green);color:var(--green);}
.di-btn.n{background:rgba(255,45,85,.1);border-color:var(--red);color:var(--red);}
.sms-ta{
  width:100%;background:var(--pill);
  border:0.5px solid var(--b);border-radius:var(--rsm);
  color:var(--t);font-family:inherit;font-size:13px;
  line-height:1.75;padding:13px 14px;
  outline:none;resize:none;height:110px;margin:8px 0 4px;
}
.sms-ta::placeholder{color:var(--t3);}
.sms-ta:focus{border-color:rgba(10,132,255,.4);}
.sms-result-row{
  display:flex;align-items:center;gap:10px;
  background:var(--pill);border-radius:var(--rsm);
  padding:10px 13px;margin-bottom:6px;
}
.sms-chk{
  width:22px;height:22px;border-radius:7px;
  border:0.5px solid rgba(255,255,255,.2);
  display:flex;align-items:center;justify-content:center;
  font-size:13px;color:transparent;cursor:pointer;
  transition:all .15s;flex-shrink:0;
}
.sms-chk.on{background:var(--green);border-color:var(--green);color:#031A0E;}
.bd-row{
  display:flex;align-items:center;
  justify-content:space-between;
  padding:13px 0;border-bottom:0.5px solid var(--b);
}
.bd-row:last-of-type{border-bottom:none;}
.bd-name{font-size:14px;font-weight:500;color:var(--t);}
.bd-input{
  background:var(--pill);border:0.5px solid var(--b);
  border-radius:8px;color:var(--t);font-family:inherit;
  font-size:14px;padding:8px 12px;outline:none;
  width:68px;text-align:center;
}
.bd-input:focus{border-color:rgba(10,132,255,.4);}

/* ━━ ONBOARDING ━━ */
.ob-ov{

  display:flex;align-items:flex-end;justify-content:center;
  z-index:998;animation:fadeOv .25s ease;
}
.ob-sheet{
  background:linear-gradient(180deg,#0F0F22 0%,#0A0A18 100%);

  padding:32px 26px calc(40px + var(--safe-bot));
  width:100%;max-width:480px;
  animation:slideSheet .32s cubic-bezier(.34,1.1,.64,1);
}
.ob-logo,.ob-logo-wrap{
  font-size:20px;font-weight:900;
  letter-spacing:.06em;margin-bottom:26px;color:var(--t);
}
.ob-logo b{color:var(--red);}
.ob-stat{
  background:rgba(255,255,255,.04);
  border:0.5px solid rgba(255,255,255,.08);
  border-radius:var(--rsm);padding:16px 18px;margin-bottom:10px;
}
.ob-stat-n,.ob-n{

}
.ob-stat-l,.ob-l{font-size:12px;color:var(--t2);}
.ob-cta{
  width:100%;padding:18px;

  font-family:inherit;font-size:16px;font-weight:800;

  box-shadow:0 4px 20px rgba(45,126,255,.4);
  letter-spacing:-.01em;
}
.ob-cta:active{opacity:.88;transform:scale(.98);}
.ob-skip{
  width:100%;padding:13px;background:none;border:none;
  font-family:inherit;font-size:13px;color:var(--t3);cursor:pointer;margin-top:8px;
}

::-webkit-scrollbar{width:0;height:0;}

/* ━━ GMAIL ━━ */
.gmail-banner{
  background:var(--card);border:0.5px solid var(--b);

}
.gmail-banner:active{background:var(--pill);}
.gmail-icon{

  background:#fff;display:flex;align-items:center;
  justify-content:center;flex-shrink:0;
}
.gmail-banner-title{
  font-size:14px;font-weight:600;color:var(--t);margin-bottom:3px;
}
.gmail-banner-sub{font-size:11px;color:var(--t2);line-height:1.4;}
.gmail-banner-arrow{font-size:18px;color:var(--t3);flex-shrink:0;}
.gmail-scanning{
  background:var(--card);border:0.5px solid rgba(77,166,255,.2);
  border-radius:var(--r);padding:20px;margin-bottom:12px;
  text-align:center;
}
.scanning-spinner{
  width:28px;height:28px;border:2px solid rgba(77,166,255,.2);

  margin:0 auto 12px;animation:spin 0.8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}
.scanning-text{

.scanning-sub{font-size:12px;color:var(--t2);}
.scanning-dots{animation:dots 1.5s infinite;}
@keyframes dots{

  40%{content:'..';}
  60%,100%{content:'...';}
}
.gmail-result-sheet{
  background:var(--card);border:0.5px solid rgba(77,166,255,.2);
  border-radius:var(--r);padding:16px;margin-bottom:12px;
}
.gmail-result-header{
  display:flex;align-items:center;justify-content:space-between;

}
.gmail-result-title{font-size:14px;font-weight:700;color:var(--t);}
.gmail-result-count{

/* ─── Helpers ─── */
function mp(s) { return s.cycle === 'yearly' ? Math.round(s.price / 12) : s.price; }
function fmt(n) { return Math.round(n).toLocaleString('ko-KR'); }

function imgErr(el, ini, clr, sz, rx) {
  const d = document.createElement('div');
  d.style.cssText = `width:${sz}px;height:${sz}px;border-radius:${rx}px;background:${clr}22;display:flex;align-items:center;justify-content:center;font-size:${Math.round(sz*.27)}px;font-weight:800;color:${clr};`;
  d.textContent = ini;
  el.replaceWith(d);
}
function mkImg(s, sz=38, pad=4, rx=9) {
  const ini = s.ini||(s.name||'?').slice(0,2).toUpperCase();
  const clr = s.clr||'#555';
  if (!s.domain) { const d=document.createElement('div'); d.style.cssText=`width:${sz}px;height:${sz}px;border-radius:${rx}px;background:${clr}22;display:flex;align-items:center;justify-content:center;font-size:${Math.round(sz*.27)}px;font-weight:800;color:${clr};`; d.textContent=ini; return d; }
  const img=document.createElement('img');
  img.src=`https://www.google.com/s2/favicons?sz=64&domain=${s.domain}`;
  img.style.cssText=`width:${sz}px;height:${sz}px;object-fit:contain;padding:${pad}px;`;
  img.onerror=function(){imgErr(this,ini,clr,sz,rx);};
  return img;
}

function nextBillingDate(billingDay) {
  if (!billingDay) return null;
  const now = new Date();
  let d = new Date(now.getFullYear(), now.getMonth(), billingDay);
  if (d <= now) d = new Date(now.getFullYear(), now.getMonth()+1, billingDay);
  return d;
}
function daysUntil(d) { return Math.ceil((d - new Date()) / 86400000); }
const DAYS = ['일','월','화','수','목','금','토'];

/* ─── Tab switching ─── */
function switchTab(idx, el) {
  document.querySelectorAll('.panel').forEach((p,i) => p.classList.toggle('on', i===idx));

/* ─── Render ─── */
function renderAll() {
  const total  = subs.reduce((a,s)=>a+mp(s),0);
  const wastes = subs.filter(s=>s.usage==='inactive');
  const waste  = wastes.reduce((a,s)=>a+mp(s),0);
  const pct    = total>0 ? Math.round(waste/total*100) : 0;
  const undiag = subs.filter(s=>s.usage==='undiagnosed');

  document.getElementById('h-total').textContent  = fmt(total);
  document.getElementById('h-waste').textContent  = '₩'+fmt(waste);
  document.getElementById('h-counts').textContent = `${subs.length} / ${wastes.length}`;
  document.getElementById('h-bar').style.width    = pct+'%';

  const banner = document.getElementById('ud-banner');
  if (undiag.length) {
    document.getElementById('ud-text').textContent = `${undiag.length}개 구독 아직 진단 전이에요`;
    banner.style.display='flex';
  } else { banner.style.display='none'; }

  // Chips
  const chips=document.getElementById('chips'); chips.innerHTML='';
  PRESETS.forEach((p,i)=>{
    const on=added.has(p.name);

    const ci=document.createElement('div'); ci.className='ci'; ci.appendChild(mkImg(p,17,2,4));
    const lb=document.createElement('span'); lb.textContent=p.name+(on?' ✓':'');
    c.append(ci,lb); chips.appendChild(c);
  });

  // Sub list
  const list=document.getElementById('sub-list'); list.innerHTML='';
  if (!subs.length) {
    const em=document.createElement('div'); em.className='empty';
    em.innerHTML='아직 구독이 없어요.<br>위에서 추가하거나 카드 문자를 붙여넣어보세요.';
    list.appendChild(em); return;
  }
  const order={inactive:0,undiagnosed:1,active:2};
  [...subs].sort((a,b)=>(order[a.usage]??9)-(order[b.usage]??9)).forEach(s=>{
    const u=USAGE[s.usage]||USAGE.undiagnosed;
    const card=document.createElement('div'); card.className='sc'+(u.waste?' waste':'');
    const lw=document.createElement('div'); lw.className='sl-logo'; lw.appendChild(mkImg(s));
    const info=document.createElement('div');
    const billingTxt = s.billingDay ? `매월 ${s.billingDay}일 결제` : '결제일 미설정';
    info.innerHTML=`<div class="sn">${s.name}</div><div class="smeta"><span>₩${fmt(mp(s))}/월</span><span>·</span><span>${billingTxt}</span></div>`;
    const sr=document.createElement('div'); sr.className='sr';
    const db=document.createElement('button'); db.className='dbtn'; db.textContent='✕'; db.onclick=()=>{added.delete(s.name);subs=subs.filter(x=>x.id!==s.id);save();renderAll();};
    const badge=document.createElement('button'); badge.className='ubadge'; badge.style.background=u.bg; badge.style.color=u.clr;
    badge.textContent=u.lbl; badge.title='탭해서 상태 변경'; badge.onclick=()=>cycleDiag(s.id);
    sr.append(db,badge); card.append(lw,info,sr); list.appendChild(card);
  });

function renderTimeline() {
  const now = new Date();
  const endOfMonth = new Date(now.getFullYear(), now.getMonth()+1, 0);
  const withDate = subs
    .map(s=>({...s, nextDate: nextBillingDate(s.billingDay)}))
    .filter(s=>s.nextDate && s.nextDate <= endOfMonth)
    .sort((a,b)=>a.nextDate-b.nextDate);

  const remaining = withDate.reduce((a,s)=>a+mp(s),0);
  document.getElementById('tl-total').textContent='₩'+fmt(remaining);
  document.getElementById('tl-sub').textContent=
    withDate.length ? `이번 달 남은 결제 ${withDate.length}건` : '이번 달 남은 결제가 없어요';

  const el=document.getElementById('tl-list'); el.innerHTML='';
  if (!subs.length || !withDate.length) {
    const em=document.createElement('div'); em.className='tl-no-billing';
    em.innerHTML='결제일이 설정된 구독이 없어요.<br>구독 목록에서 결제일을 설정해보세요.<br>';
    const btn=document.createElement('button'); btn.className='edit-billing-btn'; btn.textContent='지금 결제일 설정하기 →'; btn.onclick=openBillingEdit;
    em.appendChild(btn); el.appendChild(em); return;
  }

  const wrap=document.createElement('div'); wrap.className='tl-list';
  withDate.forEach(s=>{
    const days=daysUntil(s.nextDate);
    const u=USAGE[s.usage]||USAGE.undiagnosed;
    const row=document.createElement('div'); row.className='tl-row';

    const dc=document.createElement('div'); dc.className='tl-date-col';
    const dayN=document.createElement('div'); dayN.className='tl-day'; dayN.textContent=s.nextDate.getDate();
    const dowN=document.createElement('div'); dowN.className='tl-dow'; dowN.textContent=DAYS[s.nextDate.getDay()]+'요일';
    let badge='';
    if (days<=0) badge=`<div class="tl-badge" style="background:rgba(255,61,90,.15);color:var(--red);">오늘</div>`;
    else if (days<=3) badge=`<div class="tl-badge" style="background:rgba(255,176,32,.15);color:var(--amber);">D-${days}</div>`;
    dc.append(dayN,dowN);
    if (badge) dc.innerHTML+=badge;

    const lw=document.createElement('div'); lw.className='tl-logo'; lw.appendChild(mkImg(s,32,3,8));
    const nm=document.createElement('div');
    nm.innerHTML=`<div class="tl-name">${s.name}</div>${u.waste?`<div class="tl-waste-tag">⚠ 안 쓰는 구독</div>`:''}`;
    const pr=document.createElement('div'); pr.className='tl-price';
    pr.style.color = u.waste ? 'var(--red)' : 'var(--t)';
    pr.textContent='₩'+fmt(mp(s));
    row.append(dc,lw,nm,pr); wrap.appendChild(row);
  });
  el.appendChild(wrap);
}

/* ─── SMS parsing ─── */
const CARD_NOISE=/삼성|현대|신한|국민|하나|기업|농협|씨티|우리|롯데|BC|IBK|NH|KB|SC|카카오|네이버|토스|페이|카드|승인|결제|청구|이용|출금|완료|알림|Web발신/gi;
function parseSMS(raw) {
  const found=[],seen=new Set();
  raw.split('\n').map(l=>l.trim()).filter(Boolean).forEach(line=>{
    if(!/(승인|결제|청구|이용|출금|payment|invoice)/i.test(line)) return;
    const am=line.match(/(\d{1,3}(?:,\d{3})*)\s*원/); if(!am) return;
    const price=parseInt(am[1].replace(/,/g,''));
    if(price<990||price>999999) return;
    const svc=SMS_MAP.find(s=>s.keys.some(k=>line.toLowerCase().includes(k.toLowerCase())));
    if(svc){
      if(seen.has(svc.name)) return; seen.add(svc.name);
      found.push({...svc,detectedPrice:price});
    } else {
      const clean=line.replace(/\[.*?\]/g,'').replace(/\d{2,4}[.\-/]\d{1,2}[.\-/]\d{1,2}/g,'').replace(/\d{1,2}:\d{2}/g,'').replace(/(\d{1,3}(?:,\d{3})*)\s*원/g,'').replace(CARD_NOISE,'').replace(/[^\w가-힣\s]/g,' ').trim();
      const w=clean.split(/\s+/).find(x=>x.length>=2&&x.length<=20);
      if(w&&!seen.has(w)){seen.add(w);found.push({name:w,price,detectedPrice:price,ini:w.slice(0,2).toUpperCase(),clr:'#636380'});}
    }
  });
  return found;
}

function generateShareCard(){
  const wastes = subs.filter(s=>s.usage==='inactive');
  const tw     = wastes.reduce((a,s)=>a+mp(s),0);
  const total  = subs.reduce((a,s)=>a+mp(s),0);

  const W=600, H=800;
  const canvas=document.createElement('canvas');
  canvas.width=W; canvas.height=H;
  const ctx=canvas.getContext('2d');

  ctx.fillText(`월 총 구독 ₩${fmt(total)}  ·  낭비 중 ₩${fmt(tw)}/월`, 48, 278);

  ctx.font='700 13px Pretendard,sans-serif';

  ctx.fillText('내 구독, 제대로 관리하고 있나요?', 48, H-32);

  // Download / share
  document.fonts.ready.then(()=>{
    try {
      canvas.toBlob(blob=>{
        if(!blob) { alert('이미지 생성에 실패했어요.'); return; }
        const url=URL.createObjectURL(blob);
        if(navigator.share && navigator.canShare){
          const file=new File([blob],'subcheck-report.png',{type:'image/png'});
          if(navigator.canShare({files:[file]})){
            navigator.share({files:[file],title:'내 구독 낭비 리포트'})
              .catch(()=>downloadCanvas(url));
          } else { downloadCanvas(url); }
        } else { downloadCanvas(url); }
      },'image/png');
    } catch(e) { downloadCanvas(canvas.toDataURL('image/png').replace('image/png','image/octet-stream')); }
  });
}

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
}

function downloadCanvas(url){
  const a=document.createElement('a');
  a.href=url; a.download='subcheck-report.png'; a.click();
}

USAGE.cancelled = {lbl:'해지 완료', clr:'#00D084', bg:'rgba(0,208,132,.10)', waste:false};

function cancelSub(id){
  const s=subs.find(x=>x.id===id); if(!s) return;
  s.usage='cancelled';
  s.cancelledAt=Date.now();
  save(); renderAll(); renderSavings();
}

function renderCancelledHistory(container){
  const cancelled=subs.filter(s=>s.usage==='cancelled');
  if(!cancelled.length) return;

  const totalSaved=cancelled.reduce((a,s)=>{
    const months=s.cancelledAt ? Math.max(1,Math.round((Date.now()-s.cancelledAt)/2592000000)) : 1;
    return a+mp(s)*months;
  },0);

  const wrap=document.createElement('div');
  wrap.style.marginTop='16px';

  const lbl=document.createElement('div'); lbl.className='sl'; lbl.textContent='해지 완료 — 이만큼 아꼈어요';
  wrap.appendChild(lbl);

  const totalCard=document.createElement('div'); totalCard.className='hist-total';
  totalCard.innerHTML=`<div class="hist-total-lbl">지금까지 누적 절약</div>
    <div class="hist-total-n">₩${fmt(totalSaved)}</div>`;
  wrap.appendChild(totalCard);

  const list=document.createElement('div');
  [...cancelled].sort((a,b)=>(b.cancelledAt||0)-(a.cancelledAt||0)).forEach(s=>{
    const months=s.cancelledAt ? Math.max(1,Math.round((Date.now()-s.cancelledAt)/2592000000)) : 1;
    const saved=mp(s)*months;
    const dateStr=s.cancelledAt ? new Date(s.cancelledAt).toLocaleDateString('ko-KR',{month:'short',day:'numeric'}) : '';
    const row=document.createElement('div'); row.className='hist-item';
    const lw=document.createElement('div'); lw.className='hist-logo'; lw.appendChild(mkImg(s,30,3,8));
    const info=document.createElement('div'); info.style.flex='1';
    info.innerHTML=`<div class="hist-name">${s.name}</div><div class="hist-date">${dateStr} 해지</div>`;
    const amt=document.createElement('div'); amt.style.textAlign='right';
    amt.innerHTML=`<div class="hist-save">₩${fmt(saved)}</div><div class="hist-months">${months}개월 절약</div>`;
    const rb=document.createElement('button');
    rb.style.cssText='background:none;border:none;color:var(--t3);font-size:11px;cursor:pointer;padding:0 0 0 8px;white-space:nowrap;';
    rb.textContent='되살리기';
    rb.onclick=()=>{s.usage='inactive';delete s.cancelledAt;save();renderAll();renderSavings();};
    row.append(lw,info,amt,rb);
    list.appendChild(row);
  });
  wrap.appendChild(list);
  container.appendChild(wrap);
}

function renderNotifBanner(){
  const wrap=document.getElementById('notif-banner-wrap'); if(!wrap) return;
  wrap.innerHTML='';
  if(!('Notification' in window)) return;

  if(Notification.permission==='granted'){
    const d3=subs.filter(s=>{
      if(!s.billingDay) return false;
      const days=daysUntil(nextBillingDate(s.billingDay));
      return days>=0&&days<=3;
    });
    if(d3.length){
      const b=document.createElement('div'); b.className='notif-banner';
      b.innerHTML=`<div class="notif-text">🔔 ${d3[0].name} 외 ${d3.length}건 결제 3일 이내예요</div>
        <span class="notif-granted">알림 켜짐 ✓</span>`;
      wrap.appendChild(b);
    }
    return;
  }

  if(Notification.permission==='denied') return;

  const b=document.createElement('div'); b.className='notif-banner';
  b.innerHTML=`<div class="notif-text">결제 3일 전에 알려드릴게요<br><span style="font-size:11px;opacity:.7;">안 쓰는 구독 놓치지 마세요</span></div>
    <button class="notif-btn" onclick="requestNotif()">알림 받기</button>`;
  wrap.appendChild(b);
}

function requestNotif(){
  if(!('Notification' in window)) return;
  Notification.requestPermission().then(p=>{
    if(p==='granted'){
      checkAndNotify();
      renderNotifBanner();
    }
  });
}

function checkAndNotify(){
  if(!('Notification' in window)) return;
  if(Notification.permission!=='granted') return;
  subs.forEach(s=>{
    if(!s.billingDay||!s.usage) return;
    const nd=nextBillingDate(s.billingDay);
    const days=daysUntil(nd);
    if(days<0||days>3) return;
    const u=USAGE[s.usage];
    const body=u&&u.waste
      ? `안 쓰는 구독인데 ${days===0?'오늘':days+'일 후'} ₩${fmt(mp(s))} 결제 예정이에요. 해지할까요?`
      : `${days===0?'오늘':days+'일 후'} ₩${fmt(mp(s))} 결제 예정이에요.`;
    new Notification(`📅 ${s.name}`,{body,icon:'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="20" fill="%23FF3D5A"/><text y=".9em" font-size="80" x="10">💳</text></svg>'});
  });
}

// 구독 서비스 이메일 도메인 매핑
const EMAIL_SERVICE_MAP = [
  {keys:['netflix.com','Netflix'],           ...PRESETS[0]},

  {keys:['openai.com','ChatGPT'],             ...PRESETS[2]},

function initGmailClient() {
  if (!window.google) return;
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GMAIL_CLIENT_ID,
    scope: GMAIL_SCOPE,
    callback: async (resp) => {
      if (resp.error) { console.error(resp); return; }
      gmailToken = resp.access_token;
      await scanGmail();
    },
  });
}

function connectGmail() {
  if (!window.google) {
    alert('Google 라이브러리 로딩 중이에요. 잠시 후 다시 시도해주세요.');
    return;
  }
  if (!tokenClient) initGmailClient();
  tokenClient.requestAccessToken();
}

async function scanGmail() {
  // 배너 숨기고 스캔 표시
  document.getElementById('gmail-banner').style.display = 'none';
  const scanEl = document.getElementById('gmail-scanning');
  scanEl.style.display = 'block';

  const statusEl = document.getElementById('scanning-status');
  statusEl.textContent = '결제 영수증 이메일을 찾고 있어요...';

  try {
    // 최근 6개월 결제 관련 이메일 검색
    const query = encodeURIComponent('subject:(결제 OR 영수증 OR invoice OR receipt OR payment OR 청구 OR 구독 OR 갱신) newer_than:180d');
    const listResp = await fetch(
      `https://gmail.googleapis.com/gmail/v1/users/me/messages?q=${query}&maxResults=50`,
      {headers: {Authorization: `Bearer ${gmailToken}`}}
    );
    const listData = await listResp.json();
    const messages = listData.messages || [];

    statusEl.textContent = `${messages.length}개 이메일 분석 중...`;

    const found = {};
    let processed = 0;

    for (const msg of messages.slice(0, 30)) {
      const msgResp = await fetch(
        `https://gmail.googleapis.com/gmail/v1/users/me/messages/${msg.id}?format=metadata&metadataHeaders=From&metadataHeaders=Subject&metadataHeaders=Date`,
        {headers: {Authorization: `Bearer ${gmailToken}`}}
      );
      const msgData = await msgResp.json();
      const headers = msgData.payload?.headers || [];
      const from = headers.find(h => h.name === 'From')?.value || '';
      const subject = headers.find(h => h.name === 'Subject')?.value || '';
      const date = headers.find(h => h.name === 'Date')?.value || '';

      // 서비스 매핑
      for (const svc of EMAIL_SERVICE_MAP) {
        if (svc.keys.some(k => from.toLowerCase().includes(k.toLowerCase()) || 
                               subject.toLowerCase().includes(k.toLowerCase()))) {
          if (!found[svc.name]) {
            // 금액 추출 시도
            const amtMatch = subject.match(/([\d,]+)원/) || 
                             subject.match(/\$([\d.]+)/) ||
                             subject.match(/₩([\d,]+)/);
            const detectedPrice = amtMatch ? 
              parseInt(amtMatch[1].replace(/,/g,'')) : svc.price;
            
            found[svc.name] = {
              ...svc,
              detectedPrice: detectedPrice > 500 && detectedPrice < 200000 ? detectedPrice : svc.price,
              lastEmail: new Date(date).toLocaleDateString('ko-KR', {month:'short', day:'numeric'}),
            };
          }
          break;
        }
      }

      processed++;
      statusEl.textContent = `${processed}/${Math.min(30, messages.length)}개 분석 중...`;
    }

    scanEl.style.display = 'none';
    showGmailResults(Object.values(found));

  } catch(e) {
    console.error('Gmail scan error:', e);
    scanEl.style.display = 'none';
    document.getElementById('gmail-banner').style.display = 'flex';
    alert('Gmail 스캔 중 오류가 났어요. 다시 시도해주세요.');
  }
}

let gmailFoundSubs = [];
let gmailChecked = new Set();

function showGmailResults(found) {
  gmailFoundSubs = found;
  gmailChecked = new Set(found.map((_,i) => i));

  if (!found.length) {
    // 연동은 됐는데 구독 못찾음
    const banner = document.getElementById('gmail-banner');
    banner.style.display = 'none';
    const p0 = document.getElementById('p0');
    const connectedEl = document.createElement('div');
    connectedEl.className = 'gmail-connected';
    connectedEl.innerHTML = '✓ Gmail 연동 완료 — 결제 이메일에서 구독을 찾지 못했어요';
    p0.insertBefore(connectedEl, document.getElementById('gmail-scanning').nextSibling);
    return;
  }

  // 결과 시트 생성
  const existing = document.getElementById('gmail-results');
  if (existing) existing.remove();

  const sheet = document.createElement('div');
  sheet.id = 'gmail-results';
  sheet.className = 'gmail-result-sheet';

  const hdr = document.createElement('div');
  hdr.className = 'gmail-result-header';
  hdr.innerHTML = `
    <div class="gmail-result-title">📧 Gmail에서 발견한 구독</div>
    <div class="gmail-result-count">${found.length}개</div>
  `;
  sheet.appendChild(hdr);

  found.forEach((s, i) => {
    const row = document.createElement('div');
    row.className = 'gmail-found-item';

    const chk = document.createElement('div');
    chk.className = 'sms-chk on';
    chk.id = `gc-${i}`;
    chk.textContent = '✓';
    chk.onclick = () => {
      if (gmailChecked.has(i)) gmailChecked.delete(i);
      else gmailChecked.add(i);
      chk.className = 'sms-chk' + (gmailChecked.has(i) ? ' on' : '');
    };

    const lw = document.createElement('div');
    lw.className = 'gmail-found-logo';
    lw.appendChild(mkImg(s, 34, 3, 9));

    const info = document.createElement('div');
    info.style.flex = '1';
    info.innerHTML = `
      <div class="gmail-found-name">${s.name}</div>
      <div class="gmail-found-date">최근 이메일: ${s.lastEmail}</div>
    `;

    const price = document.createElement('div');
    price.style.textAlign = 'right';
    price.innerHTML = `<div class="gmail-found-price">₩${fmt(s.detectedPrice)}</div><div class="gmail-found-date">월</div>`;

    row.append(chk, lw, info, price);
    sheet.appendChild(row);
  });

  const addBtn = document.createElement('button');
  addBtn.className = 'gmail-add-all';
  addBtn.textContent = `선택한 구독 추가하기 (${found.length}개) →`;
  addBtn.onclick = addGmailSubs;
  sheet.appendChild(addBtn);

  const scanEl = document.getElementById('gmail-scanning');
  scanEl.parentNode.insertBefore(sheet, scanEl.nextSibling);
}

function addGmailSubs() {
  const toAdd = gmailFoundSubs.filter((_, i) => gmailChecked.has(i));
  toAdd.forEach(s => {
    if (subs.find(x => x.name === s.name)) return;
    subs.push({
      id: nextId++, name: s.name,
      price: s.detectedPrice || s.price,
      cycle: 'monthly', usage: 'undiagnosed',
      billingDay: null, domain: s.domain,
      ini: s.ini, clr: s.clr,
    });
    added.add(s.name);
  });
  save();

  document.getElementById('gmail-results')?.remove();
  
  // 연동 완료 표시
  const connectedEl = document.createElement('div');
  connectedEl.className = 'gmail-connected';
  connectedEl.innerHTML = `✓ Gmail 연동 완료 — ${toAdd.length}개 구독 추가됨`;
  document.getElementById('gmail-scanning').after(connectedEl);

  renderAll();

  // 바로 진단 유도
  if (toAdd.length > 0) {
    setTimeout(() => openDiag(), 600);
  }
}

/* ─── 홈 화면 추가 배너 ─── */
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  showInstallBanner();
});

function showInstallBanner() {
  if (localStorage.getItem('sc4_installed')) return;
  const banner = document.createElement('div');
  banner.id = 'install-banner';
  banner.style.cssText = `position:fixed;bottom:80px;left:50%;transform:translateX(-50%);
    width:calc(100% - 40px);max-width:440px;
    background:#1A1A2E;border:1px solid rgba(78,139,240,.3);
    border-radius:14px;padding:14px 16px;display:flex;
    align-items:center;gap:12px;z-index:200;
    animation:shin .3s cubic-bezier(.34,1.15,.64,1);`;
  banner.innerHTML = `
    <img src="icon-192.png" style="width:40px;height:40px;border-radius:10px;flex-shrink:0;">
    <div style="flex:1;min-width:0;">
      <div style="font-size:13px;font-weight:700;color:#EEEEF8;">홈 화면에 추가하기</div>
      <div style="font-size:11px;color:#636380;margin-top:2px;">앱처럼 바로 열 수 있어요</div>
    </div>
    <button onclick="installApp()" style="background:#4E8BF0;color:#fff;border:none;border-radius:8px;font-family:inherit;font-size:12px;font-weight:700;padding:7px 13px;cursor:pointer;flex-shrink:0;">추가</button>
    <button onclick="dismissInstall()" style="background:none;border:none;color:#636380;font-size:18px;cursor:pointer;padding:0;line-height:1;flex-shrink:0;">✕</button>`;
  document.body.appendChild(banner);
}

function installApp() {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then(r => {
    if (r.outcome === 'accepted') {
      localStorage.setItem('sc4_installed', '1');
      document.getElementById('install-banner')?.remove();
    }
    deferredPrompt = null;
  });
}

function dismissInstall() {
  localStorage.setItem('sc4_installed', '1');
  document.getElementById('install-banner')?.remove();
}

/* iOS: 홈 화면 추가 안내 (beforeinstallprompt 미지원) */

      width:calc(100% - 40px);max-width:440px;

        <img src="icon-192.png" style="width:36px;height:36px;border-radius:9px;flex-shrink:0;">
        <div style="font-size:13px;font-weight:700;color:#EEEEF8;">홈 화면에 추가하는 방법</div>

      </div>
      <div style="font-size:12px;color:#636380;line-height:1.7;">
        Safari 하단 <strong style="color:#4E8BF0;">공유 버튼 □↑</strong> 탭<br>
        → <strong style="color:#EEEEF8;">"홈 화면에 추가"</strong> 선택<br>
        → 앱 아이콘으로 바로 열 수 있어요 🎉
      </div>`;
    document.body.appendChild(b);
  }, 3000);
}
