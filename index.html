<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>SUBCHECK</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#08080D">
<meta name="mobile-web-app-capable" content="yes">

<!-- iOS Safari PWA -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SUBCHECK">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="apple-touch-icon" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-startup-image" href="icon-512.png">

<!-- General -->
<meta name="description" content="내 구독 낭비, 지금 바로 확인하세요">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<style>
:root {
  --bg:#08080D; --card:#101016; --card2:#14141C; --pill:#1A1A25;
  --b:rgba(255,255,255,0.055); --bm:rgba(255,255,255,0.10);
  --t:#EEEEF8; --t2:#636380; --t3:#2E2E42;
  --red:#FF3D5A; --green:#00D084; --amber:#FFB020; --blue:#4E8BF0; --purple:#8B7FF0;
  --r:14px; --rsm:9px; --rxs:7px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{background:var(--bg);-webkit-tap-highlight-color:transparent;}
body{font-family:'Pretendard',-apple-system,sans-serif;background:var(--bg);color:var(--t);min-height:100vh;max-width:480px;margin:0 auto;padding-bottom:100px;}

/* ── Nav Bar (bottom) ── */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:rgba(8,8,13,.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--b);display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom);}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 8px;cursor:pointer;transition:opacity .15s;user-select:none;}
.nav-item .ni{font-size:19px;line-height:1;}
.nav-item .nl{font-size:10px;font-weight:500;color:var(--t2);transition:color .15s;}
.nav-item.on .nl{color:var(--blue);}

/* ── Header ── */
.hdr{padding:20px 20px 0;display:flex;align-items:center;justify-content:space-between;}
.logo{font-size:16px;font-weight:800;letter-spacing:.1em;}
.logo b{color:var(--red);}
.hdr-right{display:flex;align-items:center;gap:8px;}
.icon-btn{background:none;border:1px solid var(--b);border-radius:var(--rxs);color:var(--t2);font-family:inherit;font-size:11px;padding:5px 10px;cursor:pointer;transition:all .15s;}
.icon-btn:hover{border-color:var(--bm);color:var(--t);}

/* ── Panels ── */
.panel{display:none;padding:16px 20px 0;}
.panel.on{display:block;}

/* ── Hero summary ── */
.hero{background:linear-gradient(135deg,#0E0E1A 0%,#12121E 100%);border:1px solid var(--b);border-radius:var(--r);padding:22px 20px 18px;margin-bottom:14px;}
.hero-lbl{font-size:11px;color:var(--t2);letter-spacing:.03em;margin-bottom:4px;}
.hero-n{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1;margin-bottom:16px;font-variant-numeric:tabular-nums;}
.hero-n .u{font-size:20px;font-weight:500;color:var(--t2);margin-right:2px;}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.sp{background:var(--pill);border-radius:var(--rsm);padding:10px 12px;}
.sp-l{font-size:10px;color:var(--t2);margin-bottom:3px;}
.sp-v{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;}
.wt{background:rgba(255,255,255,0.04);border-radius:3px;height:3px;margin-top:12px;overflow:hidden;}
.wf{height:100%;border-radius:3px;background:var(--red);transition:width .7s cubic-bezier(.4,0,.2,1);}

/* ── Undiagnosed banner ── */
.udbanner{background:rgba(78,139,240,.08);border:1px solid rgba(78,139,240,.2);border-radius:var(--rsm);padding:11px 14px;margin-bottom:11px;display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;transition:background .15s;}
.udbanner:hover{background:rgba(78,139,240,.13);}
.udb-text{font-size:12px;color:var(--blue);font-weight:500;line-height:1.5;}
.udb-btn{background:var(--blue);color:#fff;border:none;border-radius:6px;font-family:inherit;font-size:11px;font-weight:700;padding:6px 12px;cursor:pointer;white-space:nowrap;flex-shrink:0;}

/* ── SMS button ── */
.sms-btn{width:100%;padding:12px;margin-bottom:10px;background:rgba(78,139,240,.06);border:1px dashed rgba(78,139,240,.25);border-radius:var(--r);font-family:inherit;font-size:13px;font-weight:600;color:var(--blue);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;transition:all .15s;}
.sms-btn:hover{background:rgba(78,139,240,.11);border-color:rgba(78,139,240,.4);}

/* ── Section label ── */
.sl{font-size:10px;font-weight:700;color:var(--t3);letter-spacing:.09em;text-transform:uppercase;margin-bottom:8px;}

/* ── Chips ── */
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:13px;}
.chip{display:flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--b);border-radius:100px;padding:4px 9px 4px 4px;font-size:11px;font-weight:500;color:var(--t2);cursor:pointer;user-select:none;transition:all .15s;}
.chip:hover{border-color:var(--bm);color:var(--t);}
.chip.on{border-color:var(--green);color:var(--green);background:rgba(0,208,132,.07);}
.ci{width:17px;height:17px;border-radius:5px;overflow:hidden;background:var(--pill);display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:800;color:var(--t2);flex-shrink:0;}
.ci img{width:100%;height:100%;object-fit:contain;}

/* ── Add form ── */
.af{background:var(--card);border:1px solid var(--b);border-radius:var(--r);padding:13px 15px;margin-bottom:13px;}
.af-g1{display:grid;grid-template-columns:1fr 92px;gap:6px;margin-bottom:6px;}
.af-g2{display:grid;grid-template-columns:1fr 82px auto;gap:6px;}
input,select{background:var(--pill);border:1px solid var(--b);border-radius:var(--rxs);color:var(--t);font-family:inherit;font-size:12px;padding:8px 10px;outline:none;width:100%;transition:border-color .15s;}
input::placeholder{color:var(--t3);}
input:focus,select:focus{border-color:var(--bm);}
select{cursor:pointer;appearance:none;}
.add-btn{background:var(--t);color:var(--bg);border:none;border-radius:var(--rxs);font-family:inherit;font-size:12px;font-weight:700;padding:8px 13px;cursor:pointer;white-space:nowrap;transition:opacity .15s;}
.add-btn:hover{opacity:.85;}

/* ── Sub list ── */
.sub-list{display:flex;flex-direction:column;gap:7px;margin-bottom:14px;}
.sc{background:var(--card);border:1px solid var(--b);border-radius:var(--r);padding:12px 14px;display:grid;grid-template-columns:38px 1fr auto;gap:10px;align-items:center;transition:border-color .15s;animation:fi .2s ease;}
.sc:hover{border-color:var(--bm);}
.sc.waste{border-color:rgba(255,61,90,.25);background:rgba(255,61,90,.02);}
@keyframes fi{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
.sl-logo{width:38px;height:38px;border-radius:9px;background:var(--pill);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--t2);flex-shrink:0;}
.sl-logo img{width:100%;height:100%;object-fit:contain;padding:4px;}
.sn{font-size:13px;font-weight:600;color:var(--t);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.smeta{font-size:10px;color:var(--t2);display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
.sr{display:flex;flex-direction:column;align-items:flex-end;gap:4px;}
.ubadge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;cursor:pointer;border:none;font-family:inherit;white-space:nowrap;transition:opacity .15s;}
.ubadge:hover{opacity:.7;}
.dbtn{background:none;border:none;color:var(--t3);cursor:pointer;font-size:13px;line-height:1;transition:color .15s;padding:1px;}
.dbtn:hover{color:var(--red);}
.empty{text-align:center;padding:40px 0;color:var(--t2);font-size:12px;line-height:1.8;}

/* ── Timeline tab ── */
.tl-header{background:var(--card);border:1px solid var(--b);border-radius:var(--r);padding:18px 20px;margin-bottom:14px;}
.tl-total-lbl{font-size:11px;color:var(--t2);margin-bottom:3px;}
.tl-total{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;}
.tl-sub{font-size:12px;color:var(--t2);margin-top:4px;}
.tl-list{display:flex;flex-direction:column;gap:0;margin-bottom:14px;}
.tl-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--b);}
.tl-row:last-child{border-bottom:none;}
.tl-date-col{width:44px;flex-shrink:0;text-align:center;}
.tl-day{font-size:18px;font-weight:700;color:var(--t);line-height:1;font-variant-numeric:tabular-nums;}
.tl-dow{font-size:10px;color:var(--t2);margin-top:1px;}
.tl-badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;text-align:center;margin-top:2px;}
.tl-logo{width:32px;height:32px;border-radius:8px;background:var(--pill);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:var(--t2);flex-shrink:0;}
.tl-logo img{width:100%;height:100%;object-fit:contain;padding:3px;}
.tl-name{font-size:13px;font-weight:500;color:var(--t);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tl-price{font-size:13px;font-weight:700;color:var(--t);font-variant-numeric:tabular-nums;white-space:nowrap;}
.tl-waste-tag{font-size:10px;color:var(--red);font-weight:600;}
.tl-no-billing{text-align:center;padding:30px 0;color:var(--t2);font-size:12px;line-height:1.8;}
.edit-billing-btn{font-size:11px;color:var(--blue);background:none;border:none;font-family:inherit;cursor:pointer;text-decoration:underline;padding:0;margin-top:4px;}

/* ── Savings tab ── */
.save-hero{background:linear-gradient(135deg,rgba(255,61,90,.08) 0%,rgba(255,61,90,.04) 100%);border:1px solid rgba(255,61,90,.18);border-radius:var(--r);padding:20px;margin-bottom:14px;}
.save-lbl{font-size:11px;color:rgba(255,90,114,.8);margin-bottom:4px;}
.save-n{font-size:36px;font-weight:800;color:var(--red);letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin-bottom:4px;}
.save-desc{font-size:12px;color:var(--t2);line-height:1.6;}
.cancel-card{background:var(--card);border:1px solid rgba(255,61,90,.2);border-radius:var(--r);padding:14px 16px;margin-bottom:8px;}
.cc-header{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.cc-logo{width:36px;height:36px;border-radius:9px;background:var(--pill);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--t2);flex-shrink:0;}
.cc-logo img{width:100%;height:100%;object-fit:contain;padding:3px;}
.cc-name{font-size:14px;font-weight:600;color:var(--t);}
.cc-price{font-size:11px;color:var(--t2);}
.cc-savings{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.cc-save-item{background:var(--pill);border-radius:var(--rxs);padding:8px 10px;}
.cc-save-lbl{font-size:10px;color:var(--t2);margin-bottom:2px;}
.cc-save-val{font-size:14px;font-weight:700;color:var(--green);font-variant-numeric:tabular-nums;}
.cc-actions{display:flex;gap:7px;}
.cancel-btn{flex:1;padding:10px;background:rgba(255,61,90,.1);border:1px solid rgba(255,61,90,.25);border-radius:var(--rxs);font-family:inherit;font-size:12px;font-weight:700;color:var(--red);cursor:pointer;transition:all .15s;text-align:center;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:5px;}
.cancel-btn:hover{background:rgba(255,61,90,.18);}
.keep-btn{padding:10px 14px;background:none;border:1px solid var(--b);border-radius:var(--rxs);font-family:inherit;font-size:12px;color:var(--t2);cursor:pointer;transition:all .15s;}
.keep-btn:hover{border-color:var(--bm);color:var(--t);}
.save-empty{text-align:center;padding:40px 0;color:var(--t2);font-size:13px;line-height:1.9;}
.share-all-btn{width:100%;padding:14px;background:none;border:1px solid var(--b);border-radius:var(--r);font-family:inherit;font-size:13px;font-weight:600;color:var(--t2);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;transition:all .15s;margin-top:4px;}
.share-all-btn:hover{border-color:var(--bm);color:var(--t);}

/* ── Batch diagnosis modal ── */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.82);display:flex;align-items:flex-end;justify-content:center;z-index:999;animation:ovin .2s ease;}
@keyframes ovin{from{opacity:0;}to{opacity:1;}}
.sheet{background:#0F0F17;border:1px solid rgba(255,255,255,.08);border-radius:20px 20px 0 0;padding:26px 20px 40px;width:100%;max-width:480px;animation:shin .28s cubic-bezier(.34,1.15,.64,1);max-height:88vh;overflow-y:auto;}
@keyframes shin{from{transform:translateY(100%);}to{transform:translateY(0);}}
.sh-title{font-size:18px;font-weight:700;letter-spacing:-.02em;margin-bottom:3px;}
.sh-sub{font-size:12px;color:var(--t2);margin-bottom:20px;line-height:1.6;}
.di-row{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--b);}
.di-row:last-of-type{border-bottom:none;}
.di-logo{width:34px;height:34px;border-radius:8px;background:var(--pill);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:var(--t2);flex-shrink:0;}
.di-logo img{width:100%;height:100%;object-fit:contain;padding:3px;}
.di-name{font-size:13px;font-weight:500;color:var(--t);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.di-btns{display:flex;gap:5px;flex-shrink:0;}
.di-btn{padding:5px 11px;border-radius:20px;font-family:inherit;font-size:11px;font-weight:600;cursor:pointer;border:1px solid var(--b);background:none;color:var(--t2);transition:all .12s;}
.di-btn.y{background:rgba(0,208,132,.14);border-color:var(--green);color:var(--green);}
.di-btn.n{background:rgba(255,61,90,.12);border-color:var(--red);color:var(--red);}
.sh-confirm{width:100%;padding:15px;background:var(--t);color:var(--bg);border:none;border-radius:var(--rsm);font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;margin-top:16px;transition:opacity .15s;}
.sh-confirm:disabled{opacity:.35;cursor:default;}
.sh-cancel{width:100%;padding:12px;background:none;border:1px solid var(--b);border-radius:var(--rsm);font-family:inherit;font-size:12px;color:var(--t2);cursor:pointer;margin-top:8px;}
.sh-cancel:hover{border-color:var(--bm);color:var(--t);}

/* ── SMS modal ── */
.sms-ta{width:100%;background:var(--pill);border:1px solid var(--b);border-radius:var(--rsm);color:var(--t);font-family:inherit;font-size:12px;line-height:1.7;padding:11px 12px;outline:none;resize:none;height:115px;margin:8px 0 4px;}
.sms-ta::placeholder{color:var(--t3);}
.sms-ta:focus{border-color:var(--bm);}
.sms-result-row{display:flex;align-items:center;gap:9px;background:var(--pill);border-radius:var(--rsm);padding:9px 12px;margin-bottom:5px;}
.sms-chk{width:19px;height:19px;border-radius:5px;border:1px solid var(--bm);display:flex;align-items:center;justify-content:center;font-size:11px;color:transparent;cursor:pointer;transition:all .12s;flex-shrink:0;}
.sms-chk.on{background:var(--green);border-color:var(--green);color:#031A0E;}

/* ── Billing day modal ── */
.bd-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--b);}
.bd-row:last-of-type{border-bottom:none;}
.bd-name{font-size:13px;font-weight:500;color:var(--t);}
.bd-input{background:var(--pill);border:1px solid var(--b);border-radius:6px;color:var(--t);font-family:inherit;font-size:13px;padding:6px 10px;outline:none;width:64px;text-align:center;}
.bd-input:focus{border-color:var(--bm);}

::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-thumb{background:var(--bm);border-radius:2px;}

/* ── 온보딩 ── */
.ob-ov{position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;align-items:flex-end;justify-content:center;z-index:998;animation:ovin .25s ease;}
.ob-sheet{background:#0C0C14;border:1px solid rgba(255,255,255,.09);border-radius:22px 22px 0 0;padding:32px 24px 48px;width:100%;max-width:480px;animation:shin .3s cubic-bezier(.34,1.15,.64,1);}
.ob-logo{font-size:18px;font-weight:800;letter-spacing:.12em;margin-bottom:24px;}
.ob-logo b{color:var(--red);}
.ob-stat{background:var(--pill);border-radius:var(--rsm);padding:16px 18px;margin-bottom:10px;}
.ob-stat-n{font-size:30px;font-weight:800;color:var(--t);letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-bottom:2px;}
.ob-stat-l{font-size:12px;color:var(--t2);}
.ob-cta{width:100%;padding:17px;background:var(--red);border:none;border-radius:var(--rsm);font-family:inherit;font-size:15px;font-weight:700;color:#fff;cursor:pointer;margin-top:18px;transition:opacity .15s;}
.ob-cta:hover{opacity:.88;}
.ob-skip{width:100%;padding:12px;background:none;border:none;font-family:inherit;font-size:12px;color:var(--t3);cursor:pointer;margin-top:6px;}
.ob-skip:hover{color:var(--t2);}

/* ── 누적 히스토리 ── */
.hist-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.hist-total{background:rgba(0,208,132,.08);border:1px solid rgba(0,208,132,.16);border-radius:var(--rsm);padding:12px 16px;margin-bottom:10px;}
.hist-total-lbl{font-size:10px;color:rgba(0,208,132,.7);font-weight:700;letter-spacing:.07em;text-transform:uppercase;margin-bottom:3px;}
.hist-total-n{font-size:24px;font-weight:800;color:var(--green);font-variant-numeric:tabular-nums;letter-spacing:-.02em;}
.hist-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--b);}
.hist-item:last-child{border-bottom:none;}
.hist-logo{width:30px;height:30px;border-radius:8px;background:var(--pill);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:var(--t2);flex-shrink:0;}
.hist-logo img{width:100%;height:100%;object-fit:contain;padding:3px;}
.hist-name{font-size:12px;font-weight:500;color:var(--t2);flex:1;}
.hist-date{font-size:10px;color:var(--t3);}
.hist-save{font-size:12px;font-weight:600;color:var(--green);text-align:right;font-variant-numeric:tabular-nums;}
.hist-months{font-size:10px;color:rgba(0,208,132,.6);text-align:right;}

/* ── 알림 버튼 ── */
.notif-banner{background:rgba(78,139,240,.07);border:1px solid rgba(78,139,240,.18);border-radius:var(--rsm);padding:11px 14px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.notif-text{font-size:12px;color:var(--blue);line-height:1.5;}
.notif-btn{background:var(--blue);color:#fff;border:none;border-radius:6px;font-family:inherit;font-size:11px;font-weight:700;padding:6px 12px;cursor:pointer;white-space:nowrap;flex-shrink:0;}
.notif-granted{font-size:11px;color:var(--green);display:flex;align-items:center;gap:4px;}

/* ── 공유 카드 생성 버튼 ── */
.card-share-btn{width:100%;padding:14px;background:linear-gradient(135deg,rgba(255,61,90,.1) 0%,rgba(139,127,240,.1) 100%);border:1px solid rgba(255,61,90,.2);border-radius:var(--r);font-family:inherit;font-size:13px;font-weight:700;color:var(--t);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .15s;margin-bottom:8px;}
.card-share-btn:hover{border-color:rgba(255,61,90,.35);}
</style>
</head>
<body>

<!-- Header -->
<div class="hdr">
  <div class="logo">SUB<b>CHECK</b></div>
  <div class="hdr-right">
    <button class="icon-btn" onclick="openBillingEdit()">결제일 설정</button>
    <button class="icon-btn" onclick="shareAll()">공유</button>
  </div>
</div>

<!-- ── 구독 목록 panel ── -->

/* ─── Helpers ─── */
function mp(s) { return s.cycle === 'yearly' ? Math.round(s.price / 12) : s.price; }
function fmt(n) { return Math.round(n).toLocaleString('ko-KR'); }

function imgErr(el, ini, clr, sz, rx) {
  const d = document.createElement('div');
  d.style.cssText = `width:${sz}px;height:${sz}px;border-radius:${rx}px;background:${clr}22;display:flex;align-items:center;justify-content:center;font-size:${Math.round(sz*.27)}px;font-weight:800;color:${clr};`;
  d.textContent = ini;
  el.replaceWith(d);
}
function mkImg(s, sz=38, pad=4, rx=9) {
  const ini = s.ini||(s.name||'?').slice(0,2).toUpperCase();
  const clr = s.clr||'#555';
  if (!s.domain) { const d=document.createElement('div'); d.style.cssText=`width:${sz}px;height:${sz}px;border-radius:${rx}px;background:${clr}22;display:flex;align-items:center;justify-content:center;font-size:${Math.round(sz*.27)}px;font-weight:800;color:${clr};`; d.textContent=ini; return d; }
  const img=document.createElement('img');
  img.src=`https://www.google.com/s2/favicons?sz=64&domain=${s.domain}`;
  img.style.cssText=`width:${sz}px;height:${sz}px;object-fit:contain;padding:${pad}px;`;
  img.onerror=function(){imgErr(this,ini,clr,sz,rx);};
  return img;
}

function nextBillingDate(billingDay) {
  if (!billingDay) return null;
  const now = new Date();
  let d = new Date(now.getFullYear(), now.getMonth(), billingDay);
  if (d <= now) d = new Date(now.getFullYear(), now.getMonth()+1, billingDay);
  return d;
}
function daysUntil(d) { return Math.ceil((d - new Date()) / 86400000); }
const DAYS = ['일','월','화','수','목','금','토'];

/* ─── Tab switching ─── */
function switchTab(idx, el) {
  document.querySelectorAll('.panel').forEach((p,i) => p.classList.toggle('on', i===idx));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('on'));
  el.classList.add('on');
  if (idx===1) renderTimeline();
  if (idx===2) renderSavings();
}

/* ─── Render ─── */
function renderAll() {
  const total  = subs.reduce((a,s)=>a+mp(s),0);
  const wastes = subs.filter(s=>s.usage==='inactive');
  const waste  = wastes.reduce((a,s)=>a+mp(s),0);
  const pct    = total>0 ? Math.round(waste/total*100) : 0;
  const undiag = subs.filter(s=>s.usage==='undiagnosed');

  document.getElementById('h-total').textContent  = fmt(total);
  document.getElementById('h-waste').textContent  = '₩'+fmt(waste);
  document.getElementById('h-counts').textContent = `${subs.length} / ${wastes.length}`;
  document.getElementById('h-bar').style.width    = pct+'%';

  const banner = document.getElementById('ud-banner');
  if (undiag.length) {
    document.getElementById('ud-text').textContent = `${undiag.length}개 구독 아직 진단 전이에요`;
    banner.style.display='flex';
  } else { banner.style.display='none'; }

  // Chips
  const chips=document.getElementById('chips'); chips.innerHTML='';
  PRESETS.forEach((p,i)=>{
    const on=added.has(p.name);
    const c=document.createElement('div'); c.className='chip'+(on?' on':''); c.onclick=()=>addPreset(i);
    const ci=document.createElement('div'); ci.className='ci'; ci.appendChild(mkImg(p,17,2,4));
    const lb=document.createElement('span'); lb.textContent=p.name+(on?' ✓':'');
    c.append(ci,lb); chips.appendChild(c);
  });

  // Sub list
  const list=document.getElementById('sub-list'); list.innerHTML='';
  if (!subs.length) {
    const em=document.createElement('div'); em.className='empty';
    em.innerHTML='아직 구독이 없어요.<br>위에서 추가하거나 카드 문자를 붙여넣어보세요.';
    list.appendChild(em); return;
  }
  const order={inactive:0,undiagnosed:1,active:2};
  [...subs].sort((a,b)=>(order[a.usage]??9)-(order[b.usage]??9)).forEach(s=>{
    const u=USAGE[s.usage]||USAGE.undiagnosed;
    const card=document.createElement('div'); card.className='sc'+(u.waste?' waste':'');
    const lw=document.createElement('div'); lw.className='sl-logo'; lw.appendChild(mkImg(s));
    const info=document.createElement('div');
    const billingTxt = s.billingDay ? `매월 ${s.billingDay}일 결제` : '결제일 미설정';
    info.innerHTML=`<div class="sn">${s.name}</div><div class="smeta"><span>₩${fmt(mp(s))}/월</span><span>·</span><span>${billingTxt}</span></div>`;
    const sr=document.createElement('div'); sr.className='sr';
    const db=document.createElement('button'); db.className='dbtn'; db.textContent='✕'; db.onclick=()=>{added.delete(s.name);subs=subs.filter(x=>x.id!==s.id);save();renderAll();};
    const badge=document.createElement('button'); badge.className='ubadge'; badge.style.background=u.bg; badge.style.color=u.clr;
    badge.textContent=u.lbl; badge.title='탭해서 상태 변경'; badge.onclick=()=>cycleDiag(s.id);
    sr.append(db,badge); card.append(lw,info,sr); list.appendChild(card);
  });
}

function renderTimeline() {
  const now = new Date();
  const endOfMonth = new Date(now.getFullYear(), now.getMonth()+1, 0);
  const withDate = subs
    .map(s=>({...s, nextDate: nextBillingDate(s.billingDay)}))
    .filter(s=>s.nextDate && s.nextDate <= endOfMonth)
    .sort((a,b)=>a.nextDate-b.nextDate);

  const remaining = withDate.reduce((a,s)=>a+mp(s),0);
  document.getElementById('tl-total').textContent='₩'+fmt(remaining);
  document.getElementById('tl-sub').textContent=
    withDate.length ? `이번 달 남은 결제 ${withDate.length}건` : '이번 달 남은 결제가 없어요';

  const el=document.getElementById('tl-list'); el.innerHTML='';
  if (!subs.length || !withDate.length) {
    const em=document.createElement('div'); em.className='tl-no-billing';
    em.innerHTML='결제일이 설정된 구독이 없어요.<br>구독 목록에서 결제일을 설정해보세요.<br>';
    const btn=document.createElement('button'); btn.className='edit-billing-btn'; btn.textContent='지금 결제일 설정하기 →'; btn.onclick=openBillingEdit;
    em.appendChild(btn); el.appendChild(em); return;
  }

  const wrap=document.createElement('div'); wrap.className='tl-list';
  withDate.forEach(s=>{
    const days=daysUntil(s.nextDate);
    const u=USAGE[s.usage]||USAGE.undiagnosed;
    const row=document.createElement('div'); row.className='tl-row';

    const dc=document.createElement('div'); dc.className='tl-date-col';
    const dayN=document.createElement('div'); dayN.className='tl-day'; dayN.textContent=s.nextDate.getDate();
    const dowN=document.createElement('div'); dowN.className='tl-dow'; dowN.textContent=DAYS[s.nextDate.getDay()]+'요일';
    let badge='';
    if (days<=0) badge=`<div class="tl-badge" style="background:rgba(255,61,90,.15);color:var(--red);">오늘</div>`;
    else if (days<=3) badge=`<div class="tl-badge" style="background:rgba(255,176,32,.15);color:var(--amber);">D-${days}</div>`;
    dc.append(dayN,dowN);
    if (badge) dc.innerHTML+=badge;

    const lw=document.createElement('div'); lw.className='tl-logo'; lw.appendChild(mkImg(s,32,3,8));
    const nm=document.createElement('div');
    nm.innerHTML=`<div class="tl-name">${s.name}</div>${u.waste?`<div class="tl-waste-tag">⚠ 안 쓰는 구독</div>`:''}`;
    const pr=document.createElement('div'); pr.className='tl-price';
    pr.style.color = u.waste ? 'var(--red)' : 'var(--t)';
    pr.textContent='₩'+fmt(mp(s));
    row.append(dc,lw,nm,pr); wrap.appendChild(row);
  });
  el.appendChild(wrap);
}

/* ─── Usage cycle ─── */
function cycleDiag(id) {
  const s=subs.find(x=>x.id===id); if(!s) return;
  const cycle={undiagnosed:'active',active:'inactive',inactive:'active'};
  s.usage=cycle[s.usage]||'active'; save(); renderAll();
}

/* ─── Batch diagnosis ─── */
let diagState={};
function openDiag() {
  const targets=subs.filter(s=>s.usage==='undiagnosed'); if(!targets.length) return;
  diagState={}; targets.forEach(s=>{diagState[s.id]=null;});
  buildDiagModal(targets);
}
function buildDiagModal(targets) {
  const root=document.getElementById('diag-root'); root.innerHTML='';
  const ov=document.createElement('div'); ov.className='ov';
  ov.addEventListener('click',e=>{if(e.target===ov)closeDiag();});
  const sh=document.createElement('div'); sh.className='sheet';
  sh.innerHTML=`<div class="sh-title">이번 달에 썼나요?</div>
    <div class="sh-sub">${targets.length}개 구독 · "✓ 써요 / ✗ 안 써요" 탭만 하면 끝이에요.</div>`;
  const items=document.createElement('div');
  targets.forEach(s=>{
    const row=document.createElement('div'); row.className='di-row';
    const lw=document.createElement('div'); lw.className='di-logo'; lw.appendChild(mkImg(s,34,3,8));
    const nm=document.createElement('div'); nm.className='di-name'; nm.textContent=s.name;
    const btns=document.createElement('div'); btns.className='di-btns';
    const bY=document.createElement('button'); bY.className='di-btn'+(diagState[s.id]==='yes'?' y':''); bY.textContent='✓ 써요';
    bY.onclick=()=>{diagState[s.id]='yes';buildDiagModal(targets);};
    const bN=document.createElement('button'); bN.className='di-btn'+(diagState[s.id]==='no'?' n':''); bN.textContent='✗ 안 써요';
    bN.onclick=()=>{diagState[s.id]='no';buildDiagModal(targets);};
    btns.append(bY,bN); row.append(lw,nm,btns); items.appendChild(row);
  });
  sh.appendChild(items);
  const answered=Object.values(diagState).filter(v=>v!==null).length;
  const conf=document.createElement('button'); conf.className='sh-confirm'; conf.disabled=!answered;
  conf.textContent=answered===targets.length?`완료 — ${answered}개 저장하기 →`:`${answered}/${targets.length}개 답했어요`;
  conf.onclick=()=>{
    Object.entries(diagState).forEach(([id,val])=>{
      if(!val) return;
      const s=subs.find(x=>x.id===+id); if(s) s.usage=val==='yes'?'active':'inactive';
    });
    save(); closeDiag(); renderAll();
  };
  const cancel=document.createElement('button'); cancel.className='sh-cancel'; cancel.textContent='나중에 할게요'; cancel.onclick=closeDiag;
  sh.append(conf,cancel); ov.appendChild(sh); root.appendChild(ov);
}
function closeDiag(){document.getElementById('diag-root').innerHTML='';}

/* ─── Add ─── */
function addPreset(idx) {
  const p=PRESETS[idx]; if(!p||added.has(p.name)) return;
  subs.push({id:nextId++,name:p.name,price:p.price,cycle:'monthly',usage:'undiagnosed',billingDay:null,domain:p.domain,ini:p.ini,clr:p.clr});
  added.add(p.name); save(); renderAll();
}
function addManual() {
  const name=document.getElementById('i-name').value.trim();
  const price=parseInt(document.getElementById('i-price').value)||0;
  const bday=parseInt(document.getElementById('i-bday').value)||null;
  if(!name||!price) return;
  subs.push({id:nextId++,name,price,cycle:document.getElementById('i-cycle').value,usage:'undiagnosed',billingDay:bday});
  document.getElementById('i-name').value=''; document.getElementById('i-price').value=''; document.getElementById('i-bday').value='';
  save(); renderAll();
}

/* ─── Billing day edit ─── */
function openBillingEdit() {
  const root=document.getElementById('billing-root'); root.innerHTML='';
  const ov=document.createElement('div'); ov.className='ov';
  ov.addEventListener('click',e=>{if(e.target===ov)closeBilling();});
  const sh=document.createElement('div'); sh.className='sheet';
  sh.innerHTML=`<div class="sh-title">결제일 설정</div>
    <div class="sh-sub">매월 몇 일에 결제되는지 입력하면<br>다음 결제 탭에서 일정을 확인할 수 있어요.</div>`;
  if(!subs.length){sh.innerHTML+=`<p style="color:var(--t2);font-size:13px;padding:20px 0;">추가된 구독이 없어요.</p>`;}
  subs.forEach(s=>{
    const row=document.createElement('div'); row.className='bd-row';
    const nm=document.createElement('div'); nm.className='bd-name'; nm.textContent=s.name;
    const inp=document.createElement('input'); inp.type='number'; inp.className='bd-input';
    inp.min=1; inp.max=31; inp.placeholder='일'; inp.value=s.billingDay||'';
    inp.onchange=()=>{const v=parseInt(inp.value); s.billingDay=(v>=1&&v<=31)?v:null; save(); renderTimeline();};
    row.append(nm,inp); sh.appendChild(row);
  });
  const done=document.createElement('button'); done.className='sh-confirm'; done.textContent='완료';
  done.onclick=closeBilling;
  const cl=document.createElement('button'); cl.className='sh-cancel'; cl.textContent='닫기'; cl.onclick=closeBilling;
  sh.append(done,cl); ov.appendChild(sh); root.appendChild(ov);
}
function closeBilling(){document.getElementById('billing-root').innerHTML='';}

/* ─── SMS parsing ─── */
const CARD_NOISE=/삼성|현대|신한|국민|하나|기업|농협|씨티|우리|롯데|BC|IBK|NH|KB|SC|카카오|네이버|토스|페이|카드|승인|결제|청구|이용|출금|완료|알림|Web발신/gi;
function parseSMS(raw) {
  const found=[],seen=new Set();
  raw.split('\n').map(l=>l.trim()).filter(Boolean).forEach(line=>{
    if(!/(승인|결제|청구|이용|출금|payment|invoice)/i.test(line)) return;
    const am=line.match(/(\d{1,3}(?:,\d{3})*)\s*원/); if(!am) return;
    const price=parseInt(am[1].replace(/,/g,''));
    if(price<990||price>999999) return;
    const svc=SMS_MAP.find(s=>s.keys.some(k=>line.toLowerCase().includes(k.toLowerCase())));
    if(svc){
      if(seen.has(svc.name)) return; seen.add(svc.name);
      found.push({...svc,detectedPrice:price});
    } else {
      const clean=line.replace(/\[.*?\]/g,'').replace(/\d{2,4}[.\-/]\d{1,2}[.\-/]\d{1,2}/g,'').replace(/\d{1,2}:\d{2}/g,'').replace(/(\d{1,3}(?:,\d{3})*)\s*원/g,'').replace(CARD_NOISE,'').replace(/[^\w가-힣\s]/g,' ').trim();
      const w=clean.split(/\s+/).find(x=>x.length>=2&&x.length<=20);
      if(w&&!seen.has(w)){seen.add(w);found.push({name:w,price,detectedPrice:price,ini:w.slice(0,2).toUpperCase(),clr:'#636380'});}
    }
  });
  return found;
}

function generateShareCard(){

  ctx.fillStyle='rgba(255,255,255,0.25)';
  ctx.textAlign='right';
  ctx.fillText(`${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')} 리포트`, W-48, 68);
  ctx.textAlign='left';

  // Divider
  ctx.fillStyle='rgba(255,255,255,0.06)';
  ctx.fillRect(48,88,W-96,1);

  // Annual waste (hero number)
  ctx.font='400 14px Pretendard,sans-serif';
  ctx.fillStyle='rgba(255,61,90,0.7)';
  ctx.fillText('지금 해지하면 연간 절약 가능', 48, 148);

  ctx.font='800 72px Pretendard,sans-serif';
  ctx.fillStyle='#FF3D5A';
  const annualTxt='₩'+fmt(tw*12);
  ctx.fillText(annualTxt, 48, 240);

  // Monthly summary
  ctx.font='400 15px Pretendard,sans-serif';
  ctx.fillStyle='rgba(238,238,248,0.45)';
  ctx.fillText(`월 총 구독 ₩${fmt(total)}  ·  낭비 중 ₩${fmt(tw)}/월`, 48, 278);

  // Divider
  ctx.fillStyle='rgba(255,255,255,0.06)';
  ctx.fillRect(48,305,W-96,1);

  // Waste list
  ctx.font='700 13px Pretendard,sans-serif';
  ctx.fillStyle='rgba(255,61,90,0.6)';
  ctx.fillText('해지하면 좋을 구독', 48, 340);

  const showWastes=wastes.slice(0,5);
  showWastes.forEach((s,i)=>{
    const y=380+i*62;
    // Card bg
    ctx.fillStyle='rgba(255,255,255,0.03)';
    roundRect(ctx,48,y-18,W-96,50,8);
    ctx.fill();
    // Name

    ctx.fillText(s.name,70,y+8);
    // Price
    ctx.font='700 15px Pretendard,sans-serif';

    ctx.textAlign='right';
    ctx.fillText('월 ₩'+fmt(mp(s)),W-56,y+8);
    ctx.textAlign='left';
    ctx.font='400 11px Pretendard,sans-serif';

    ctx.textAlign='right';
    ctx.fillText('연 ₩'+fmt(mp(s)*12)+' 낭비',W-56,y+22);

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
}

function downloadCanvas(url){
  const a=document.createElement('a');
  a.href=url; a.download='subcheck-report.png'; a.click();
}

function renderCancelledHistory(container){
  const cancelled=subs.filter(s=>s.usage==='cancelled');
  if(!cancelled.length) return;

  const totalSaved=cancelled.reduce((a,s)=>{
    const months=s.cancelledAt ? Math.max(1,Math.round((Date.now()-s.cancelledAt)/2592000000)) : 1;
    return a+mp(s)*months;
  },0);

  const wrap=document.createElement('div');
  wrap.style.marginTop='16px';

  const lbl=document.createElement('div'); lbl.className='sl'; lbl.textContent='해지 완료 — 이만큼 아꼈어요';
  wrap.appendChild(lbl);

  const totalCard=document.createElement('div'); totalCard.className='hist-total';
  totalCard.innerHTML=`<div class="hist-total-lbl">지금까지 누적 절약</div>
    <div class="hist-total-n">₩${fmt(totalSaved)}</div>`;
  wrap.appendChild(totalCard);

  const list=document.createElement('div');
  [...cancelled].sort((a,b)=>(b.cancelledAt||0)-(a.cancelledAt||0)).forEach(s=>{
    const months=s.cancelledAt ? Math.max(1,Math.round((Date.now()-s.cancelledAt)/2592000000)) : 1;
    const saved=mp(s)*months;
    const dateStr=s.cancelledAt ? new Date(s.cancelledAt).toLocaleDateString('ko-KR',{month:'short',day:'numeric'}) : '';
    const row=document.createElement('div'); row.className='hist-item';

function renderNotifBanner(){
  const wrap=document.getElementById('notif-banner-wrap'); if(!wrap) return;
  wrap.innerHTML='';
  if(!('Notification' in window)) return;

  if(Notification.permission==='granted'){
    const d3=subs.filter(s=>{
      if(!s.billingDay) return false;
      const days=daysUntil(nextBillingDate(s.billingDay));
      return days>=0&&days<=3;
    });
    if(d3.length){
      const b=document.createElement('div'); b.className='notif-banner';
      b.innerHTML=`<div class="notif-text">🔔 ${d3[0].name} 외 ${d3.length}건 결제 3일 이내예요</div>
        <span class="notif-granted">알림 켜짐 ✓</span>`;
      wrap.appendChild(b);
    }
    return;
  }

  if(Notification.permission==='denied') return;

  const b=document.createElement('div'); b.className='notif-banner';
  b.innerHTML=`<div class="notif-text">결제 3일 전에 알려드릴게요<br><span style="font-size:11px;opacity:.7;">안 쓰는 구독 놓치지 마세요</span></div>
    <button class="notif-btn" onclick="requestNotif()">알림 받기</button>`;
  wrap.appendChild(b);
}

function requestNotif(){
  if(!('Notification' in window)) return;
  Notification.requestPermission().then(p=>{
    if(p==='granted'){
      checkAndNotify();
      renderNotifBanner();
    }
  });
}

function checkAndNotify(){
  if(!('Notification' in window)) return;
  if(Notification.permission!=='granted') return;
  subs.forEach(s=>{
    if(!s.billingDay||!s.usage) return;
    const nd=nextBillingDate(s.billingDay);
    const days=daysUntil(nd);
    if(days<0||days>3) return;
    const u=USAGE[s.usage];
    const body=u&&u.waste
      ? `안 쓰는 구독인데 ${days===0?'오늘':days+'일 후'} ₩${fmt(mp(s))} 결제 예정이에요. 해지할까요?`
      : `${days===0?'오늘':days+'일 후'} ₩${fmt(mp(s))} 결제 예정이에요.`;
    new Notification(`📅 ${s.name}`,{body,icon:'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="20" fill="%23FF3D5A"/><text y=".9em" font-size="80" x="10">💳</text></svg>'});
  });
}

    } else {
      const ca=document.createElement('button'); ca.className='cancel-btn'; ca.textContent='✂️ 해지하기';
      ca.onclick=()=>alert(`${s.name}\n공식 앱 → 설정 → 구독 관리 → 해지`);
      actions.appendChild(ca);
    }

    // 해지 완료 버튼 (히스토리 저장)
    const done=document.createElement('button'); done.className='keep-btn';
    done.style.cssText='padding:10px 10px;background:rgba(0,208,132,.08);border:1px solid rgba(0,208,132,.2);color:var(--green);font-size:11px;font-weight:600;border-radius:var(--rxs);cursor:pointer;white-space:nowrap;font-family:inherit;';
    done.textContent='해지 완료 ✓';
    done.onclick=()=>cancelSub(s.id);
    actions.appendChild(done);

    // 유지 버튼
    const kb=document.createElement('button'); kb.className='keep-btn'; kb.textContent='유지';
    kb.onclick=()=>{const t=subs.find(x=>x.id===s.id);if(t){t.usage='active';save();renderAll();renderSavings();}};
    actions.appendChild(kb);

    card.append(header,savings,actions); el.appendChild(card);
  });

  // 공유 버튼
  const shareBtn=document.createElement('button'); shareBtn.className='share-all-btn'; shareBtn.onclick=shareAll;
  shareBtn.innerHTML='📤 결과 텍스트 공유하기';
  el.appendChild(shareBtn);

  // 누적 히스토리
  renderCancelledHistory(el);
}

/* ─── Init ─── */
try { renderAll(); } catch(e){ console.error('renderAll',e); }
try { renderNotifBanner(); } catch(e){ console.error('notif',e); }
try { checkAndNotify(); } catch(e){ console.error('notify',e); }
try { checkOnboarding(); } catch(e){ console.error('onboard',e); }

/* ─── Service Worker 등록 ─── */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then(reg => console.log('SW registered:', reg.scope))
      .catch(err => console.log('SW failed:', err));
  });
}

/* ─── 홈 화면 추가 배너 ─── */
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  showInstallBanner();
});

function showInstallBanner() {
  if (localStorage.getItem('sc4_installed')) return;
  const banner = document.createElement('div');
  banner.id = 'install-banner';
  banner.style.cssText = `position:fixed;bottom:80px;left:50%;transform:translateX(-50%);
    width:calc(100% - 40px);max-width:440px;
    background:#1A1A2E;border:1px solid rgba(78,139,240,.3);
    border-radius:14px;padding:14px 16px;display:flex;
    align-items:center;gap:12px;z-index:200;
    animation:shin .3s cubic-bezier(.34,1.15,.64,1);`;
  banner.innerHTML = `
    <img src="icon-192.png" style="width:40px;height:40px;border-radius:10px;flex-shrink:0;">
    <div style="flex:1;min-width:0;">
      <div style="font-size:13px;font-weight:700;color:#EEEEF8;">홈 화면에 추가하기</div>
      <div style="font-size:11px;color:#636380;margin-top:2px;">앱처럼 바로 열 수 있어요</div>
    </div>
    <button onclick="installApp()" style="background:#4E8BF0;color:#fff;border:none;border-radius:8px;font-family:inherit;font-size:12px;font-weight:700;padding:7px 13px;cursor:pointer;flex-shrink:0;">추가</button>
    <button onclick="dismissInstall()" style="background:none;border:none;color:#636380;font-size:18px;cursor:pointer;padding:0;line-height:1;flex-shrink:0;">✕</button>`;
  document.body.appendChild(banner);
}

function installApp() {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then(r => {
    if (r.outcome === 'accepted') {
      localStorage.setItem('sc4_installed', '1');
      document.getElementById('install-banner')?.remove();
    }
    deferredPrompt = null;
  });
}

function dismissInstall() {
  localStorage.setItem('sc4_installed', '1');
  document.getElementById('install-banner')?.remove();
}

/* iOS: 홈 화면 추가 안내 (beforeinstallprompt 미지원) */
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
const isStandalone = window.navigator.standalone;
if (isIOS && !isStandalone && !localStorage.getItem('sc4_ios_hint')) {
  setTimeout(() => {
    const b = document.createElement('div');
    b.style.cssText = `position:fixed;bottom:80px;left:50%;transform:translateX(-50%);
      width:calc(100% - 40px);max-width:440px;
      background:#1A1A2E;border:1px solid rgba(78,139,240,.25);
      border-radius:14px;padding:14px 16px;z-index:200;
      animation:shin .3s cubic-bezier(.34,1.15,.64,1);`;
    b.innerHTML = `
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">
        <img src="icon-192.png" style="width:36px;height:36px;border-radius:9px;flex-shrink:0;">
        <div style="font-size:13px;font-weight:700;color:#EEEEF8;">홈 화면에 추가하는 방법</div>
        <button onclick="this.closest('div[style]').remove();localStorage.setItem('sc4_ios_hint','1')" style="background:none;border:none;color:#636380;font-size:18px;cursor:pointer;padding:0;margin-left:auto;line-height:1;">✕</button>
      </div>
      <div style="font-size:12px;color:#636380;line-height:1.7;">
        Safari 하단 <strong style="color:#4E8BF0;">공유 버튼 □↑</strong> 탭<br>
        → <strong style="color:#EEEEF8;">"홈 화면에 추가"</strong> 선택<br>
        → 앱 아이콘으로 바로 열 수 있어요 🎉
      </div>`;
    document.body.appendChild(b);
  }, 3000);
}
</script>
